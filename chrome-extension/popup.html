<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshy To STL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Meshy To STL</h1>
        <button id="scan" type="button" title="Refresh current tab scan">Refresh</button>
      </header>

      <select id="links" size="6" aria-label="Detected .meshy files"></select>

      <label for="base-name">File name</label>
      <input id="base-name" type="text" placeholder="model" autocomplete="off" spellcheck="false">

      <label for="format">Output format</label>
      <select id="format">
        <option value="stl">STL (3D printing)</option>
        <option value="obj">OBJ + textures (.zip)</option>
        <option value="gltf">GLTF + textures (.zip)</option>
        <option value="glb">GLB (original decoded model)</option>
        <option value="textures">Textures only (.zip)</option>
      </select>

      <label class="checkbox" id="png-row">
        <input id="png" type="checkbox" checked>
        Convert textures to PNG
      </label>

      <div class="row">
        <button id="inspect" type="button" class="secondary">Inspect textures</button>
        <button id="convert" type="button">Download STL</button>
      </div>

      <details id="texture-box" hidden>
        <summary id="texture-summary">Textures</summary>
        <ul id="texture-list"></ul>
      </details>

      <progress id="progress" hidden></progress>
      <p id="status">Ready.</p>
    </main>

    <iframe id="sandbox" src="sandbox.html" hidden></iframe>
    <script src="popup.js"></script>
  </body>
</html>
